services:
  mws-ui-kit:
    image: ghcr.io/mws-mad-labs/mws-ui-kit:latest
    container_name: mws-ui-kit
    restart: unless-stopped
    pull_policy: always
    ports:
      - "0.0.0.0:18080:80"
    volumes:
      - ./brand-assets:/usr/share/nginx/html/images/brand:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
