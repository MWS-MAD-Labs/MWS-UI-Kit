name: Build and deploy UI kit

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: mws-ui-kit-deploy
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/mws-mad-labs/mws-ui-kit

jobs:
  build-and-publish:
    name: Build and publish Docker image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  trigger-komodo:
    name: Trigger Komodo redeploy
    runs-on: ubuntu-latest
    needs: build-and-publish
    env:
      KOMODO_WEBHOOK_URL: ${{ secrets.KOMODO_WEBHOOK_URL }}

    steps:
      - name: Call Komodo webhook
        if: ${{ env.KOMODO_WEBHOOK_URL != '' }}
        run: |
          curl --fail --silent --show-error --request POST "$KOMODO_WEBHOOK_URL"
