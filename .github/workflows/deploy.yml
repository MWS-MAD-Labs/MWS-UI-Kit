name: Build and deploy UI kit

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: mws-ui-kit-deploy
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/mws-mad-labs/mws-ui-kit

jobs:
  build-and-publish:
    name: Build and publish Docker image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  trigger-komodo:
    name: Trigger Komodo redeploy
    runs-on: ubuntu-latest
    needs: build-and-publish
    env:
      KOMODO_WEBHOOK_URL: ${{ secrets.KOMODO_WEBHOOK_URL }}
      KOMODO_WEBHOOK_SECRET: ${{ secrets.KOMODO_WEBHOOK_SECRET }}

    steps:
      - name: Call Komodo GitHub listener
        if: ${{ env.KOMODO_WEBHOOK_URL != '' && env.KOMODO_WEBHOOK_SECRET != '' }}
        run: |
          python3 <<'PY' > /tmp/komodo_webhook.env
          import hashlib
          import hmac
          import json
          import os
          import uuid

          payload = {
              "ref": "refs/heads/main",
              "after": os.environ["GITHUB_SHA"],
              "repository": {
                  "full_name": os.environ["GITHUB_REPOSITORY"],
                  "name": os.environ["GITHUB_REPOSITORY"].split("/", 1)[1],
                  "owner": {
                      "name": os.environ["GITHUB_REPOSITORY"].split("/", 1)[0]
                  },
              },
              "sender": {
                  "login": os.environ["GITHUB_ACTOR"]
              },
          }
          body = json.dumps(payload, separators=(",", ":"))
          secret = os.environ["KOMODO_WEBHOOK_SECRET"].encode()
          signature = hmac.new(secret, body.encode(), hashlib.sha256).hexdigest()

          with open("/tmp/komodo_payload.json", "w", encoding="utf-8") as file:
              file.write(body)

          print(f"GITHUB_DELIVERY={uuid.uuid4()}")
          print(f"GITHUB_SIGNATURE=sha256={signature}")
          PY

          . /tmp/komodo_webhook.env

          curl --fail --silent --show-error \
            --request POST "$KOMODO_WEBHOOK_URL" \
            --header "Content-Type: application/json" \
            --header "X-GitHub-Event: push" \
            --header "X-GitHub-Delivery: $GITHUB_DELIVERY" \
            --header "X-Hub-Signature-256: $GITHUB_SIGNATURE" \
            --data-binary @/tmp/komodo_payload.json

      - name: Skip Komodo webhook
        if: ${{ env.KOMODO_WEBHOOK_URL == '' || env.KOMODO_WEBHOOK_SECRET == '' }}
        run: echo "KOMODO_WEBHOOK_URL or KOMODO_WEBHOOK_SECRET is not configured; skipping Komodo redeploy."
